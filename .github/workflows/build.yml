name: Build Ghidra Plugin

# This workflow owns the build. It is also reusable: release.yml calls it so
# the expensive Ghidra matrix is defined exactly once.
#
#   build.yml  -> verify -> build (Ghidra 11.x, 12.x) -> upload artifacts
#   release.yml -> guard -> build.yml -> publish -> verify the release
#
# Releases are NOT created here. release.yml is the single release authority.

on:
  push:
    branches: [ main, 'api-*', 'feature/*', 'feat/*', 'bugfix/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit, branch or tag to build (defaults to the triggering ref)'
        required: false
        type: string
        default: ''
      artifact_prefix:
        description: 'Prefix for the uploaded artifact set'
        required: false
        type: string
        default: 'Ghydra-nightly'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Version constants must agree
        # The plugin (Java) and the bridge (Python) each announce a version.
        # If they drift apart, a release ships artifacts that lie about
        # themselves, so this gate runs on every push and pull request.
        run: python3 scripts/version.py --check

  build:
    name: Build ${{ matrix.ghidra-series }}.x
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghidra-series: [ "11", "12" ]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Full history so git-commit-id can describe the tag; the artifact
          # name embeds git describe, which falls back to a bare sha without it.
          fetch-depth: 0

      - name: Resolve latest Ghidra ${{ matrix.ghidra-series }}.x
        id: ghidra
        env:
          # The automatic job token, in the context form the GitHub CLI
          # documents. `secrets.GITHUB_TOKEN` is the same value, but the
          # context is the canonical one and it also resolves in a
          # reusable workflow called with `workflow_call`.
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ matrix.ghidra-series }}
        run: |
          set -euo pipefail
          json=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases?per_page=100")
          # Newest release whose tag is in this major series, then its PUBLIC zip asset.
          url=$(echo "$json" | jq -r --arg s "$SERIES" '
            [ .[] | select(.tag_name | test("^Ghidra_" + $s + "\\.")) ]
            | sort_by(.published_at) | last
            | .assets[] | select(.name | test("_PUBLIC_[0-9]+\\.zip$")) | .browser_download_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "Could not resolve a Ghidra ${SERIES}.x release"; exit 1
          fi
          ver=$(echo "$url" | grep -oP 'ghidra_\K[0-9]+\.[0-9]+(\.[0-9]+)?(?=_PUBLIC)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Resolved Ghidra $ver"
          echo "  $url"

      - name: Cache Ghidra ${{ steps.ghidra.outputs.version }}
        id: cache-ghidra
        uses: actions/cache@v5
        with:
          path: ghidra-install
          key: ghidra-${{ steps.ghidra.outputs.version }}

      - name: Download Ghidra ${{ steps.ghidra.outputs.version }}
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o ghidra.zip "${{ steps.ghidra.outputs.url }}"
          mkdir -p ghidra-install
          unzip -q ghidra.zip -d ghidra-install

      - name: Detect the JDK this Ghidra release needs
        id: jdk
        run: |
          set -euo pipefail
          # The Ghidra jars are compiled with the JDK the release requires, and
          # javac cannot read a class file newer than itself: building against
          # Ghidra 12.2 (which needs JDK 25) with JDK 21 fails with
          # "bad class file". Read the requirement out of the distribution
          # instead of guessing it — the class file major version is 44 plus
          # the JDK number (65 = 21, 69 = 25).
          jar=$(echo ghidra-install/ghidra_*/Ghidra/Framework/SoftwareModeling/lib/SoftwareModeling.jar)
          major=$(unzip -p "$jar" ghidra/program/model/listing/Program.class \
            | od -An -tu1 -j6 -N2 | awk '{print $1 * 256 + $2}')
          jdk=$((major - 44))
          # The extension is compiled for Java 21, so never go below it.
          if [ "$jdk" -lt 21 ]; then jdk=21; fi
          echo "version=$jdk" >> "$GITHUB_OUTPUT"
          echo "Ghidra $(echo ghidra-install/ghidra_*/) needs JDK $jdk (class file major $major)"

      - name: Set up JDK ${{ steps.jdk.outputs.version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.jdk.outputs.version }}
          distribution: 'temurin'
          cache: maven

      - name: Set GHIDRA_HOME
        run: echo "GHIDRA_HOME=$(echo "$PWD"/ghidra-install/ghidra_*_PUBLIC)" >> "$GITHUB_ENV"

      - name: Build with Maven
        run: mvn -B package -Dghidra.version=${{ steps.ghidra.outputs.version }}

      - name: Tag artifacts with Ghidra version
        # extension.properties carries ghidraVersion and Ghidra refuses to load
        # an extension whose ghidraVersion does not match the running install.
        # The file name says the same thing, so the user picks the right zip.
        run: |
          set -euo pipefail
          for f in target/Ghydra-*.zip; do
            mv "$f" "${f%.zip}-ghidra${{ steps.ghidra.outputs.version }}.zip"
          done
          ls -1 target/Ghydra-*.zip

      - name: Stage artifacts
        # upload-artifact preserves the directory structure relative to the
        # least common ancestor of the matched paths. Uploading the zips and
        # the bridge from their own locations would put the zips under
        # "target/" inside the artifact, and the release job would then look
        # for dist/*.zip and find nothing. Staging them in one directory
        # makes the artifact flat.
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/Ghydra-*.zip dist/
          cp bridge_mcp_hydra.py dist/
          ls -1 dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix || 'Ghydra-nightly' }}-ghidra${{ steps.ghidra.outputs.version }}
          path: dist/
