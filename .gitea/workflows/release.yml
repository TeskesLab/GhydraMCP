name: Release

# The Forgejo mirror of the GitHub release.
#
# Same guard as the GitHub workflow (version.py / release_notes.py), same
# artifact set (Ghidra 11.x and 12.x), same SHA256SUMS. The release is created
# with tea because the Forgejo instance is on the local network and is not
# reachable from a GitHub-hosted runner.
#
# Trigger it by pushing the tag to this repository:
#   git push forgejo main && git push forgejo v3.1.0
#
# Or dispatch it by hand for a dry run, which builds everything and checks
# the credentials without creating a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the v prefix (e.g. 3.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Build and check the credentials, but do not publish'
        required: false
        default: 'false'
        type: string

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Resolve the release version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid version"
            exit 1
          fi
          # The dry-run flag is resolved here, once, and handed on as a step
          # output. A workflow_dispatch input arrives as the string "true",
          # so it has to be compared as a string.
          PUBLISH=true
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then PUBLISH=false; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (publish=$PUBLISH)"

      - name: "Guard: version constants must match the release version"
        run: python3 scripts/version.py --check --expect "${{ steps.meta.outputs.version }}"

      - name: "Guard: CHANGELOG must have notes for this version"
        run: python3 scripts/release_notes.py --version "${{ steps.meta.outputs.version }}" --out release_notes.md

      - name: Install build tools
        # This runner image ships without Maven, and jq/unzip are needed to
        # resolve and unpack the Ghidra distributions.
        run: |
          apt-get update
          apt-get install -y maven jq unzip curl python3
          mvn --version

      - name: Probe the credentials
        # The two APIs need two different tokens, and this instance decides
        # which ones exist. The probe reports what it finds - lengths and HTTP
        # status codes only, never a token - so the build and the publish
        # steps can act on facts instead of assumptions.
        id: probe
        env:
          PROBE_GITHUB: ${{ secrets.GITHUB_TOKEN }}
          PROBE_GITEA: ${{ secrets.RELEASE_TOKEN }}
          GITEA_SERVER: ${{ github.server_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "GITHUB_TOKEN secret: $([ -n "$PROBE_GITHUB" ] && echo present || echo empty)"
          echo "RELEASE_TOKEN secret: $([ -n "$PROBE_GITEA" ] && echo present || echo empty)"

          # A GitHub token would let the Ghidra release list be read
          # authenticated, which avoids the unauthenticated rate limit.
          GITHUB_USABLE=false
          if [ -n "$PROBE_GITHUB" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $PROBE_GITHUB" \
              "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases?per_page=1")
            echo "GITHUB_TOKEN against api.github.com: HTTP $code"
            if [ "$code" = "200" ]; then GITHUB_USABLE=true; fi
          fi
          echo "github_token_usable=$GITHUB_USABLE" >> "$GITHUB_OUTPUT"

          # Which secret can talk to this Gitea instance? Gitea fills the
          # GITHUB_TOKEN secret with its own job token, so that one usually
          # works here; a hand-made RELEASE_TOKEN works too.
          SOURCE=none
          for pair in "GITHUB_TOKEN:$PROBE_GITHUB" "RELEASE_TOKEN:$PROBE_GITEA"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            [ -z "$value" ] && continue
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: token $value" \
              "$GITEA_SERVER/api/v1/repos/$GITEA_REPOSITORY/releases")
            echo "$name against the Gitea API: HTTP $code"
            if [ "$code" = "200" ] && [ "$SOURCE" = "none" ]; then SOURCE="$name"; fi
          done
          echo "gitea_token_source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Build the extension for each supported Ghidra series
        env:
          # The Ghidra release list lives on GitHub and is public, so the
          # normal path is an unauthenticated call. A GitHub token would
          # avoid the rate limit, but this instance cannot hold one: Gitea
          # reserves the GITHUB_ prefix for secrets it provides itself, and
          # a Gitea token is rejected by GitHub. The probe decides.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN_USABLE: ${{ steps.probe.outputs.github_token_usable }}
        run: |
          set -euo pipefail
          mkdir -p target
          for SERIES in 11 12; do
            echo "::group::Ghidra ${SERIES}.x"
            AUTH=()
            if [ -n "${GH_TOKEN:-}" ] && [ "${GH_TOKEN_USABLE}" = "true" ]; then
              AUTH=(-H "Authorization: Bearer ${GH_TOKEN}")
            fi
            json=$(curl -fsSL "${AUTH[@]}" \
              "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases?per_page=100")
            url=$(echo "$json" | jq -r --arg s "$SERIES" '
              [ .[] | select(.tag_name | test("^Ghidra_" + $s + "\\.")) ]
              | sort_by(.published_at) | last
              | .assets[] | select(.name | test("_PUBLIC_[0-9]+\\.zip$")) | .browser_download_url')
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "Could not resolve a Ghidra ${SERIES}.x release"; exit 1
            fi
            ver=$(echo "$url" | grep -oP 'ghidra_\K[0-9]+\.[0-9]+(\.[0-9]+)?(?=_PUBLIC)')
            echo "Ghidra ${SERIES}.x -> ${ver}"

            # Each series builds in its own worktree: the artifact name embeds
            # the build timestamp, so two builds sharing a target/ directory
            # could collide on the same name.
            WORK="build-${SERIES}"
            git worktree add --detach "$WORK" HEAD
            curl -fsSL -o "${WORK}/ghidra.zip" "$url"
            mkdir -p "${WORK}/ghidra-install"
            unzip -q "${WORK}/ghidra.zip" -d "${WORK}/ghidra-install"

            # The Ghidra jars are compiled with the JDK the release requires, and
            # javac cannot read a class file newer than itself: building against
            # Ghidra 12.2 (which needs JDK 25) with JDK 21 fails with "bad
            # class file". Read the requirement out of the distribution instead
            # of guessing it - the class file major version is 44 plus the JDK
            # number (65 = 21, 69 = 25).
            jar=$(echo "${WORK}/ghidra-install/ghidra_*/Ghidra/Framework/SoftwareModeling/lib/SoftwareModeling.jar")
            major=$(unzip -p "$jar" ghidra/program/model/listing/Program.class \
              | od -An -tu1 -j6 -N2 | awk '{print $1 * 256 + $2}')
            jdk=$((major - 44))
            # The extension is compiled for Java 21, so never go below it.
            if [ "$jdk" -lt 21 ]; then jdk=21; fi
            echo "Ghidra ${ver} needs JDK ${jdk} (class file major ${major})"

            # The JDK is installed per series, because a single job builds them
            # all and the toolchain has to match each distribution.
            mkdir -p "${WORK}/jdk"
            curl -fsSL -o "${WORK}/jdk.tar.gz" \
              "https://api.adoptium.net/v3/binary/latest/${jdk}/ga/linux/x64/jdk/hotspot/normal/eclipse"
            tar -xzf "${WORK}/jdk.tar.gz" -C "${WORK}/jdk" --strip-components=1

            (
              cd "$WORK"
              export JAVA_HOME="$WORK/jdk"
              export PATH="${JAVA_HOME}/bin:${PATH}"
              java -version
              export GHIDRA_HOME="$(echo "$PWD"/ghidra-install/ghidra_*_PUBLIC)"
              mvn -B package -Dghidra.version="$ver"
              for f in target/Ghydra-*.zip; do
                mv "$f" "${f%.zip}-ghidra${ver}.zip"
              done
              mv target/Ghydra-*.zip ../target/
            )
            git worktree remove --force "$WORK"
            echo "::endgroup::"
          done
          ls -1 target/Ghydra-*.zip

      - name: Checksum the artifacts
        run: |
          set -euo pipefail
          cd target
          sha256sum *.zip > SHA256SUMS
          cd ..
          cat target/SHA256SUMS

      - name: Install tea CLI
        run: |
          curl -sL https://dl.gitea.io/tea/0.13.0/tea-0.13.0-linux-amd64 -o /usr/local/bin/tea
          chmod +x /usr/local/bin/tea

      - name: Check the release credentials
        # A dry run proves that the credentials work, without publishing.
        if: ${{ steps.meta.outputs.publish != 'true' }}
        env:
          TEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_SOURCE: ${{ steps.probe.outputs.gitea_token_source }}
          GITEA_SERVER: ${{ github.server_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          REPO_OWNER="${GITEA_REPOSITORY%%/*}"
          REPO_NAME="${GITEA_REPOSITORY#*/}"
          if [ "$TOKEN_SOURCE" = "none" ]; then
            echo "::error::no secret authenticates against this Gitea instance: neither GITHUB_TOKEN nor RELEASE_TOKEN works. Gitea reserves the GITHUB_ and GITEA_ prefixes, so a hand-made secret has to carry another name."
            exit 1
          fi
          TOKEN="${!TOKEN_SOURCE}"
          count=$(curl -sf -H "Authorization: token $TOKEN" \
            "$GITEA_SERVER/api/v1/repos/$GITEA_REPOSITORY/releases" | jq 'length')
          echo "the $TOKEN_SOURCE secret authenticates: ${count} existing release(s)"
          # The publish step logs in with the same token, so prove that too.
          tea login add --name default --url "$GITEA_SERVER" --token "$TOKEN"
          tea releases ls --repo "${REPO_OWNER}/${REPO_NAME}" --login default

      - name: Create the release
        if: ${{ steps.meta.outputs.publish == 'true' }}
        env:
          # The Gitea token that creates the release. Gitea reserves the
          # GITHUB_ and GITEA_ prefixes for the secrets it provides itself,
          # so a repository secret has to carry another name - but the
          # instance's own job token usually works, and the probe picks
          # whichever one authenticates.
          TEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_SOURCE: ${{ steps.probe.outputs.gitea_token_source }}
          GITEA_SERVER: ${{ github.server_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          REPO_OWNER="${GITEA_REPOSITORY%%/*}"
          REPO_NAME="${GITEA_REPOSITORY#*/}"
          if [ "$TOKEN_SOURCE" = "none" ]; then
            echo "::error::no secret authenticates against this Gitea instance: neither GITHUB_TOKEN nor RELEASE_TOKEN works"
            exit 1
          fi
          TOKEN="${!TOKEN_SOURCE}"

          tea login add --name default --url "$GITEA_SERVER" --token "$TOKEN"

          if curl -sf -H "Authorization: token $TOKEN" \
               "$GITEA_SERVER/api/v1/repos/$GITEA_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do"
            exit 0
          fi

          ASSETS=()
          for f in target/Ghidra-*.zip target/SHA256SUMS bridge_mcp_hydra.py; do
            [ -f "$f" ] && ASSETS+=("--asset" "$f")
          done

          tea releases create \
            --repo "${REPO_OWNER}/${REPO_NAME}" \
            --login default \
            --tag "$TAG" \
            --title "Release $TAG" \
            --note-file release_notes.md \
            "${ASSETS[@]}"

      - name: Verify the release
        if: ${{ steps.meta.outputs.publish == 'true' }}
        env:
          TEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKEN_SOURCE: ${{ steps.probe.outputs.gitea_token_source }}
          GITEA_SERVER: ${{ github.server_url }}
          GITEA_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if [ "$TOKEN_SOURCE" = "none" ]; then
            echo "::error::no secret authenticates against this Gitea instance"
            exit 1
          fi
          TOKEN="${!TOKEN_SOURCE}"
          curl -sf -H "Authorization: token $TOKEN" \
            "$GITEA_SERVER/api/v1/repos/$GITEA_REPOSITORY/releases/tags/$TAG" \
            | jq '{tag: .tag_name, assets: [.assets[].name]}'
