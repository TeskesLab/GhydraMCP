name: Build Ghidra Plugin

# Nightly/smoke build for the Forgejo instance.
#
# Releases are NOT created here. .gitea/workflows/release.yml is the release
# authority for this platform, and it is triggered by the tag push.

on:
  push:
    branches: [ main, 'api-*', 'feature/*', 'feat/*', 'bugfix/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Maven and Python
      run: |
        apt-get update && apt-get install -y maven python3 python3-venv python3-pip
        mvn --version
        python3 --version

    - name: Set up the Python environment
      run: |
        python3 -m venv .venv
        . .venv/bin/activate
        python -m pip install --upgrade pip
        python -m pip install -e .

    - name: "Guard: version constants must agree"
      run: python3 scripts/version.py --check

    - name: "Guard: compile Python sources"
      run: |
        . .venv/bin/activate
        python -m compileall -q bridge_mcp_hydra.py ghydra

    - name: Contract suites (no Ghidra required)
      # The six no-Ghidra suites always execute. A summary made of skipped
      # suites proves nothing, so CI demands this set on every push and PR.
      run: |
        . .venv/bin/activate
        python run_tests.py --no-ghidra

    - name: Build with Maven
      # This runner has no Ghidra install, so the build compiles against the jars
      # committed in lib/ (Ghidra 12.0.1). Stamp that version into
      # extension.properties so the extension declares what it was actually built
      # against. The release workflow (release.yml) instead downloads a real
      # Ghidra per series and overrides both GHIDRA_HOME and ghidra.version.
      run: mvn -B package -Dghidra.version=12.0.1

    - name: Upload nightly artifacts
      uses: actions/upload-artifact@v3
      with:
        name: GhydraMCP-nightly
        path: |
          target/Ghydra-*.zip
          bridge_mcp_hydra.py
