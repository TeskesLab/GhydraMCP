[project]
name = "ghydramcp"
version = "3.0.0"
description = "Multi-instance Ghidra plugin with HATEOAS REST API and MCP bridge for AI-assisted reverse engineering, binary analysis, and decompilation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "LaurieWired" },
    { name = "Teal Bauer", email = "teal@starsong.consulting" },
    { name = "Lucas Teske", email = "lucas@teske.com.br" },
]
dependencies = [
    "mcp==1.6.0",
    # mcp 1.6.0 imports pydantic._internal._typing_extra.eval_type_backport, which
    # pydantic 2.14 removed. Without this ceiling a fresh resolve picks pydantic
    # >=2.14 and `import bridge_mcp_hydra` dies with an ImportError. Drop the pin
    # (or raise it) when mcp is upgraded past that breakage.
    "pydantic<2.14",
    "requests==2.32.3",
    "click>=8.1.0,<9",
    "rich>=13.0.0,<14",
    "urllib3>=2.0.0,<3",
]

[project.scripts]
ghydramcp = "bridge_mcp_hydra:main"
ghydra = "ghydra.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghydra"]
include = ["bridge_mcp_hydra.py", "ghydra/**/*.py"]
